<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <!--
    Agent Orange, "point" pose. Draft art.
    Same 200x300 canvas and anchor (feet at bottom center, 100,292) in every pose.
    No colors here: coco.css colors the c-* classes. Every glowing part
    uses --agent-glow, which shifts from icy blue to orange with --thaw.
    #face is hidden under #hood and #mask until the finale reveal.
  -->
  <defs>
    <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-20" width="280" height="340">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="legs">
    <path class="ol c-suit" d="M74 214H96V262H74Z"/>
    <path class="ol c-suit" d="M104 214H126V262H104Z"/>
    <path class="c-suit-shade" d="M118 216H124V260H118Z"/>
    <path class="c-glow-line" filter="url(#glow)" d="M85 226V252M115 226V252"/>
    <path class="ol c-boot" d="M70 254H98V286Q98 292 92 292H72Q66 292 66 286V262Q66 254 70 254Z"/>
    <path class="ol c-boot" d="M102 254H130Q134 254 134 262V286Q134 292 128 292H108Q102 292 102 286Z"/>
  </g>
  <g id="torso">
    <path class="ol c-suit" d="M64 150Q64 136 80 134H120Q136 136 136 150L132 222Q100 230 68 222Z"/>
    <path class="c-suit-shade" d="M118 135H120Q134 137 134 150L130 220Q124 223 116 224Z"/>
    <path class="ol c-trim" d="M66 208Q100 214 134 208L133 220Q100 228 67 220Z"/>
    <rect class="c-glow" filter="url(#glow)" x="94" y="211" width="12" height="7" rx="2"/>
    <path class="c-glow-line" filter="url(#glow)" d="M76 148V168H86M124 148V164H114M80 196H90V204M120 196H110V204"/>
    <g id="emblem" class="agent-emblem" filter="url(#glow)">
      <path class="c-glow" d="M100 188L98 186.2C90 179 85 174.5 85 169C85 164.6 88.4 161.2 92.8 161.2C95.7 161.2 98.4 162.6 100 164.8C101.6 162.6 104.3 161.2 107.2 161.2C111.6 161.2 115 164.6 115 169C115 174.5 110 179 102 186.2Z"/>
    </g>
  </g>
  <g id="arms" class="agent-arms">
    <path class="arm-ol" d="M68 150Q44 150 24 146"/>
    <path class="arm-fill c-suit-stroke" d="M68 150Q44 150 24 146"/>
    <path class="c-glow-line" filter="url(#glow)" d="M68 150Q44 150 24 146"/>
    <rect class="ol c-glove" x="5" y="142" width="16" height="8" rx="4"/>
    <circle class="ol c-glove" cx="22" cy="146" r="10"/>
    <path class="arm-ol" d="M132 148Q152 172 136 196"/>
    <path class="arm-fill c-suit-stroke" d="M132 148Q152 172 136 196"/>
    <path class="c-glow-line" filter="url(#glow)" d="M132 148Q152 172 136 196"/>
    <circle class="ol c-glove" cx="134" cy="198" r="10"/>
  </g>
  <g id="head" class="agent-head">
    <g id="hood" class="agent-hood">
    <path class="ol c-hood" d="M100 14C112 22 150 36 154 84C156 116 136 138 100 140C64 138 44 116 46 84C50 36 88 22 100 14Z"/>
    <path class="c-hood-shade" d="M128 32C146 48 154 66 154 86C155 112 140 132 112 138C134 124 146 104 144 80C142 60 136 44 128 32Z"/>
    <path class="c-highlight" d="M70 40Q80 28 94 24Q84 34 76 46Z"/>
    </g>
    <g id="face" class="agent-face"><!-- [PLACEHOLDER: Jake's face for the finale reveal] --></g>
    <g id="mask" class="agent-mask">
      <ellipse class="ol-thin c-mask" cx="100" cy="90" rx="36" ry="38"/>
      <path class="c-highlight" d="M74 70Q82 59 96 56" fill="none" stroke-width="3"/>
      <ellipse class="c-glow-line" filter="url(#glow)" cx="100" cy="90" rx="40" ry="42"/>
      <path class="c-glow-line" filter="url(#glow)" d="M100 22V46"/>
    </g>
    <g id="eyes" class="agent-visor" filter="url(#glow)">
      <path class="c-visor" d="M68 86H124"/>
      <path class="c-visor-core" d="M68 86H124"/>
    </g>
  </g>
</svg>
