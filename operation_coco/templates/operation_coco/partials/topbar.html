{% comment %}
  The FrostOS top bar, shared by the lock screens and the desktop.
  Pass heart_meter=True to show how far Jake's heart has thawed.
{% endcomment %}
<header class="topbar">
  <span class="topbar__brand">FrostOS</span>
  <time class="topbar__clock" data-clock="time"></time>
  {% if heart_meter %}
    <span class="heart-meter" id="heart-meter">
      <svg class="heart-meter__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="heart-meter__heart" d="M12 20.5l-1.2-1.1C6 15.1 3 12.3 3 8.9 3 6.2 5.1 4 7.8 4c1.6 0 3.1.8 4.2 2 1.1-1.2 2.6-2 4.2-2C18.9 4 21 6.2 21 8.9c0 3.4-3 6.2-7.8 10.5L12 20.5z"/>
        <rect class="heart-meter__ice" x="1.5" y="2" width="21" height="20" rx="4"/>
        <path class="heart-meter__crack" d="M6 5l3 4-2 3M18 18l-3-3 1-3"/>
      </svg>
      <span class="heart-meter__text"><span class="heart-meter__long">Jake's heart: </span>{{ thaw_percent }}%<span class="heart-meter__long"> thawed.</span></span>
    </span>
  {% endif %}
  {# Decoration only: these icons do nothing. #}
  <span class="topbar__icons" aria-hidden="true">
    <svg class="topbar__icon" viewBox="0 0 24 24" focusable="false">
      <path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 16a5 5 0 0 1 6.8 0"/>
      <circle class="topbar__icon-fill" cx="12" cy="19.2" r="1.4"/>
    </svg>
    <svg class="topbar__icon" viewBox="0 0 24 24" focusable="false">
      <rect x="2.5" y="7" width="17" height="10" rx="2.5"/>
      <path d="M22 10.5v3"/>
      <rect class="topbar__icon-fill" x="4.75" y="9.25" width="9" height="5.5" rx="1"/>
    </svg>
    <svg class="topbar__icon" viewBox="0 0 24 24" focusable="false">
      <path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5M10 3.8 12 5.8l2-2M10 20.2l2-2 2 2M4.6 10.1l2.7-.7-.7-2.7M19.4 13.9l-2.7.7.7 2.7M4.6 13.9l2.7.7-.7 2.7M19.4 10.1l-2.7-.7.7-2.7"/>
    </svg>
  </span>
</header>
