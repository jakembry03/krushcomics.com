{% if items %}

    <div
        class="project-carousel"
        role="region"
        aria-label="Latest projects"
        tabindex="0"
    >

        {% for project in items %}
            
            {% include "projects/_project_card.html" %}
        
        {% endfor %}
    
    </div>

{% else %}

    <p class="projects-empty">
        No projects have been added yet.
        Check back soon!
    </p>

{% endif %}
