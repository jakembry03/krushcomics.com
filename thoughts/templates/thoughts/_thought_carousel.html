{% if items %}

    <div
        class="carousel thought-carousel"
        role="region"
        aria-label="Latest Thoughts"
        tabindex="0"
    >

        {% for thought in items %}

            {% include "thoughts/_thought_card.html" %}

        {% endfor %}

    </div>

{% else %}

    <p class="empty">
        Nothing has been posted yet.
        Check back soon!
    </p>

{% endif %}
